<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>keyring</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/ui/style.css" />
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 24 16"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="8" r="4.5"/><path d="M10.5 5H23M19 5V7.5M22 5V7.5M10.5 11H23M19 11V13.5M22 11V13.5"/></g></svg>keyring</a>
      <nav><a href="/docs/api">API</a> <a href="/docs/mcp">MCP</a> <button id="signout" type="button" hidden>Sign out</button></nav>
    </header>
    <main>
      <div id="landing" class="landing" hidden></div>
      <p id="status" role="status">Loading…</p>
      <form id="signin" hidden>
        <label for="token">Sign in with keyring's admin token</label>
        <input id="token" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
      <section id="secrets" hidden>
        <h2>Secrets</h2>
        <p class="meta">Values go in and are never shown again: a list shows at most the last 4 characters. A new value replaces a secret's, as its next version.</p>
        <form id="addSecret" class="row">
          <input id="addName" name="name" required placeholder="NAME" autocomplete="off" autocapitalize="off" aria-label="Name" />
          <input id="addDescription" name="description" placeholder="what it is for" autocomplete="off" aria-label="Description" />
          <input id="addValue" name="value" type="password" required placeholder="value" autocomplete="new-password" aria-label="Value" />
          <button type="submit">Add secret</button>
        </form>
        <p id="said" class="said" role="status"></p>
        <ul id="list"></ul>
        <h3>Recent audit</h3>
        <ul id="audit" class="audit"></ul>
      </section>
    </main>
  </body>
</html>
